providers:
  - name: primary
    fail_rate: 0.25
    base_latency_ms: 180
    cost_per_1k_tokens: 0.01
  - name: backup
    fail_rate: 0.05
    base_latency_ms: 260
    cost_per_1k_tokens: 0.006

circuit_breaker:
  failure_threshold: 3
  reset_timeout_seconds: 2
  success_threshold: 1

cache:
  enabled: false
  backend: memory          # "memory" or "redis"; use redis after docker compose up -d
  ttl_seconds: 300
  similarity_threshold: 0.92
  redis_url: "redis://localhost:6379/0"

load_test:
  requests: 200
  concurrency: 10

scenarios:
  - name: primary_timeout_100
    description: "Primary provider fails 100%; backup should serve traffic after circuit opens."
    provider_overrides:
      primary: 1.0
      backup: 0.0

  - name: primary_flaky_50
    description: "Primary provider fails 50%; circuit should open and recover while backup handles failures."
    provider_overrides:
      primary: 0.5
      backup: 0.0

  - name: cache_stale_candidate
    description: "Low threshold cache test; different years must not produce a false cache hit."
    provider_overrides:
      primary: 0.0
      backup: 0.0
    similarity_threshold: 0.3

  - name: all_providers_down
    description: "All providers fail; gateway must return static fallback without crashing."
    provider_overrides:
      primary: 1.0
      backup: 1.0

  - name: all_healthy
    description: "Baseline healthy-provider run with high availability and low fallback."
    provider_overrides:
      primary: 0.0
      backup: 0.0